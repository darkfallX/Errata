<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Errata film</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#e9ebee;--mute:#8b939c;--line:#2a2f35;--bg:#07080a;--panel:#111418;--green:#21c08b;--green-bg:rgba(33,192,139,.14);--red:#ff4d6d;--red-bg:rgba(255,77,109,.14);--amber:#ffb340;--amber-bg:rgba(255,179,64,.14);--blue:#5aa9ff}
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(1400px 800px at 50% 40%,#12161b 0%,#07080a 70%)}
.layer{position:absolute;inset:0;opacity:0;will-change:opacity,transform}
.grain{position:absolute;inset:-50%;pointer-events:none;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.9'/></svg>")}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(1200px 700px at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%)}

/* browser card */
.card{position:absolute;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 40px 120px -30px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.06)}
.card .bar{height:44px;background:#1b1f24;display:flex;align-items:center;gap:8px;padding:0 16px}
.card .bar i{width:12px;height:12px;border-radius:50%;background:#3a4048;display:block}
.card .url{margin-left:18px;flex:1;height:28px;border-radius:8px;background:#0f1215;color:#aab2bb;font:500 14px JetBrains Mono,monospace;display:flex;align-items:center;padding:0 12px;gap:8px;white-space:nowrap;overflow:hidden}
.card .url b{color:#e9ebee;font-weight:600}
.card .view{position:relative;overflow:hidden;background:#fff}
.card .world{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.card .world img{width:1920px;height:1080px;display:block}
.tag{position:absolute;height:34px;padding:0 14px;border-radius:999px;display:flex;align-items:center;gap:8px;font:700 15px Inter;white-space:nowrap;backdrop-filter:blur(8px)}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.tag.ok{background:rgba(10,40,30,.85);color:var(--green)} .tag.no{background:rgba(50,10,20,.85);color:var(--red)} .tag.warn{background:rgba(50,35,10,.85);color:var(--amber)} .tag.n{background:rgba(20,24,28,.88);color:#cfd5db}
.hl{position:absolute;border-radius:10px;pointer-events:none}
.hl svg{position:absolute;inset:-6px;overflow:visible}
.cursor{position:absolute;left:0;top:0;width:34px;height:34px;pointer-events:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.45));z-index:5}
.ripple{position:absolute;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:3px solid rgba(90,169,255,.9);pointer-events:none;opacity:0}

/* type */
.big{font:900 120px/1 Inter;letter-spacing:-.045em}
.h1{font:800 64px/1.08 Inter;letter-spacing:-.03em}
.h2{font:800 44px/1.15 Inter;letter-spacing:-.025em}
.lead{font:500 28px/1.45 Inter;color:#c7cdd3}
.mono{font-family:JetBrains Mono,monospace}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}

/* captions */
#cap{position:absolute;left:0;right:0;bottom:46px;display:flex;justify-content:center;pointer-events:none;z-index:50}
#cap span.box{max-width:1300px;padding:12px 22px;border-radius:14px;background:rgba(6,8,10,.62);backdrop-filter:blur(10px);font:600 30px/1.35 Inter;letter-spacing:-.01em;text-align:center;color:rgba(233,235,238,.55);transition:none}
#cap .w{display:inline}
#cap .w.on{color:#fff}

/* terminal */
.term{position:absolute;border-radius:16px;background:#0b0d10;box-shadow:0 40px 120px -30px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.07);overflow:hidden}
.term .bar{height:44px;background:#15181c;display:flex;align-items:center;gap:8px;padding:0 16px;font:500 14px JetBrains Mono;color:#7d868f}
.term .bar i{width:12px;height:12px;border-radius:50%;background:#30363d;display:block}
.term pre{padding:26px 34px;font:500 21px/1.62 JetBrains Mono,monospace;color:#d6dbe0;white-space:pre}
.g{color:var(--green)} .r{color:var(--red)} .a{color:var(--amber)} .d{color:#6f7880} .b{color:#fff;font-weight:700} .s{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px;color:#9aa3ab}
.caret{display:inline-block;width:12px;height:24px;background:#d6dbe0;vertical-align:-4px;margin-left:2px}

/* diagram */
.node{position:absolute;width:300px;height:150px;border-radius:18px;background:#101318;border:1.5px solid #2a2f35;padding:22px 24px;display:flex;flex-direction:column;gap:10px}
.node b{font:800 34px Inter;letter-spacing:-.02em}
.node span{font:500 17px JetBrains Mono;color:#8b939c}
.pill{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 24px;border-radius:999px;font:700 24px Inter}
.pill.ok{background:var(--green-bg);color:var(--green)} .pill.no{background:var(--red-bg);color:var(--red)} .pill.warn{background:var(--amber-bg);color:var(--amber)}
.chip{display:inline-flex;align-items:center;height:46px;padding:0 20px;border-radius:999px;background:#12161b;border:1px solid #262b31;font:600 21px Inter;color:#cfd5db}
.panel{position:absolute;border-radius:18px;background:#0e1115;border:1px solid #23282e;box-shadow:0 30px 90px -30px rgba(0,0,0,.8);overflow:hidden}
.panel .ph{padding:16px 22px;border-bottom:1px solid #23282e;font:700 18px Inter;color:#cfd5db;display:flex;justify-content:space-between}
.panel pre{padding:20px 24px;font:500 19px/1.6 JetBrains Mono;color:#d6dbe0;white-space:pre}
.logo{display:inline-flex;align-items:center;gap:18px;font:800 64px Inter;letter-spacing:-.03em}
</style></head>
<body>
<div id="stage"></div>
<script>
// ───────────────────────────── engine
const TL = window.TL, BOX = window.BOXES;
const stage = document.getElementById("stage");
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const eo = (x) => 1 - Math.pow(1 - clamp(x), 4);            // ease out quart (soft landing)
const eio = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const k = (t, a, d = 0.9, f = eo) => f((t - a) / d);           // 0→1 starting at a, over d seconds
const lerp = (a, b, x) => a + (b - a) * x;
const el = (tag, cls, html, style) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (style) Object.assign(e.style, style); return e; };
const SC = Object.fromEntries(TL.scenes.map((s) => [s.id, s]));
const norm = (w) => w.toLowerCase().replace(/[^a-z0-9]/g, "");
/** Absolute time of the nth time `word` is spoken in a scene (falls back to the scene's voice start). */
function W(id, word, nth = 1, add = 0) {
  const s = SC[id]; let c = 0;
  for (const w of s.words) if (norm(w.w) === norm(word) && ++c === nth) return w.t + add;
  console.warn("word not found", id, word, nth); return s.voice + add;
}
const scenes = [];
function scene(id, build) { const s = SC[id]; const layer = el("div", "layer"); stage.appendChild(layer); const upd = build(layer, s); scenes.push({ s, layer, upd }); }

// browser card with a camera
function card(parent, { img, url, x = 160, y = 70, w = 1600 }) {
  const h = Math.round(w * 1080 / 1920);
  const c = el("div", "card", null, { left: x + "px", top: y + "px", width: w + "px" });
  const bar = el("div", "bar", `<i></i><i></i><i></i><div class="url"><span>🔒</span>${url}</div>`);
  const view = el("div", "view", null, { width: w + "px", height: h + "px" });
  const world = el("div", "world"); world.appendChild(el("img", null, null)).src = `img/${img}.jpg`;
  view.appendChild(world); c.append(bar, view); parent.appendChild(c);
  const base = w / 1920;
  const cam = { z: 1, fx: 960, fy: 540 };
  const apply = () => { const z = base * cam.z; world.style.transform = `translate(${w / 2 - cam.fx * z}px,${h / 2 - cam.fy * z}px) scale(${z})`; };
  apply();
  return { c, world, view, cam, apply, w, h,
    look(z, fx, fy) { cam.z = z; cam.fx = clamp(fx, 960 / z, 1920 - 960 / z); cam.fy = clamp(fy, 540 / z, 1080 - 540 / z); apply(); },
    setImg(name) { world.querySelector("img").src = `img/${name}.jpg`; } };
}
// highlight a region (viewport coords) with a drawn outline
function highlight(world, box, color = "#ff4d6d", pad = 10) {
  const hl = el("div", "hl", null, { left: box.x - pad + "px", top: box.y - pad + "px", width: box.w + pad * 2 + "px", height: box.h + pad * 2 + "px" });
  const W = box.w + pad * 2 + 12, H = box.h + pad * 2 + 12, P = 2 * (W + H);
  hl.innerHTML = `<svg width="${W}" height="${H}"><rect x="3" y="3" width="${W - 6}" height="${H - 6}" rx="10" fill="${color}22" stroke="${color}" stroke-width="5" stroke-dasharray="${P}" stroke-dashoffset="${P}"/></svg>`;
  world.appendChild(hl);
  const r = hl.querySelector("rect");
  return { set(x) { r.style.strokeDashoffset = P * (1 - x); hl.style.opacity = x > 0 ? 1 : 0; r.setAttribute("fill", color + Math.round(34 * x).toString(16).padStart(2, "0")); }, el: hl };
}
const CURSOR = `<svg viewBox="0 0 24 24" width="34" height="34"><path d="M4 2 L4 20 L9 15 L12.5 22 L15.5 20.6 L12 13.8 L19 13.8 Z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
function cursor(world) { const c = el("div", "cursor", CURSOR); const rp = el("div", "ripple"); world.append(c, rp); return {
  at(x, y) { c.style.transform = `translate(${x}px,${y}px)`; c.style.opacity = 1; },
  hide() { c.style.opacity = 0; },
  click(x, y, p) { rp.style.left = x + "px"; rp.style.top = y + "px"; rp.style.opacity = p > 0 && p < 1 ? 1 - p : 0; rp.style.transform = `scale(${0.4 + p * 1.4})`; } }; }
/** cursor path through timed waypoints [[t,x,y],…] with eased moves */
function path(pts, t) { if (t <= pts[0][0]) return pts[0].slice(1); for (let i = 1; i < pts.length; i++) if (t <= pts[i][0]) { const [t0, x0, y0] = pts[i - 1], [t1, x1, y1] = pts[i]; const p = eio((t - t0) / (t1 - t0)); return [lerp(x0, x1, p), lerp(y0, y1, p)]; } return pts.at(-1).slice(1); }
const mid = (b) => [b.x + b.w / 2, b.y + b.h / 2];
// typing: n chars of `str` visible
const typed = (str, t, start, cps = 16) => str.slice(0, Math.max(0, Math.floor((t - start) * cps)));
// reveal: fade + rise
function rise(e, x, dy = 24) { e.style.opacity = x; e.style.transform = `translateY(${(1 - x) * dy}px)`; }

// ───────────────────────────── scenes
const logoSvg = (s = 64) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><rect x="3" y="3.5" width="16" height="17" rx="3.5" fill="none" stroke="#e9ebee" stroke-width="2"/><path d="M7 9.5h8M7 14h4.5" stroke="#e9ebee" stroke-width="2" stroke-linecap="round"/><path d="M6 14.2h7.5" stroke="#ff4d6d" stroke-width="1.6" stroke-linecap="round"/><circle cx="19.5" cy="5" r="3" fill="#ff4d6d"/></svg>`;

// 1 · cold open: the old tutorial, then Wikipedia today
scene("cold-open", (L, s) => {
  const a = card(L, { img: "htg", url: "howtogeek.com/<b>27882/create-an-ebook-or-pdf-from-wikipedia-articles</b>" });
  const b = card(L, { img: "wiki", url: "en.wikipedia.org/wiki/<b>Ada_Lovelace</b>" });
  const date = el("div", "tag n", "How-To Geek · published Sep 3, 2010", { left: "190px", top: "132px" }); L.appendChild(date);
  const bTag = el("div", "tag no", "Wikipedia today · no Print/export in the left sidebar", { left: "190px", top: "132px" }); L.appendChild(bTag);
  const BX = BOX.htg["Print/export"], WB = BOX.wiki;
  const hA = highlight(a.world, { x: BX.x - 78, y: BX.y - 2, w: Math.min(1250 - BX.x, 470) + 74, h: 30 }, "#ffb340", 8);
  const side = { x: 220, y: 130, w: 260, h: 380 };
  const hB = highlight(b.world, side, "#ff4d6d", 6);
  const cur = cursor(b.world);
  const tOpen = W("cold-open", "open"), tNothing = W("cold-open", "Nothing"), tOld = W("cold-open", "old");
  return (t) => {
    // A: the tutorial, slowly pushing in on the instruction
    const showA = clamp((t - s.start) / 1.2) * (1 - k(t, tOpen - 0.3, 0.6));
    a.c.style.opacity = showA; date.style.opacity = showA;
    a.look(lerp(1.05, 1.75, eio((t - s.start - 0.5) / 7)), lerp(900, 800, eio((t - s.start - 0.5) / 7)), lerp(560, BX.y + 20, eio((t - s.start - 0.5) / 7)));
    hA.set(k(t, W("cold-open", "Print") - 0.2, 1.1));
    // B: Wikipedia, the cursor hunting in the left sidebar
    const showB = k(t, tOpen - 0.3, 0.7);
    b.c.style.opacity = showB; bTag.style.opacity = k(t, tNothing, 0.6);
    const zb = lerp(1.0, 1.35, eio((t - tOpen) / 9));
    b.look(zb, lerp(960, 640, eio((t - tOpen) / 9)), lerp(540, 420, eio((t - tOpen) / 9)));
    const [cx, cy] = path([[tOpen, 900, 700], [tOpen + 1.2, 330, 260], [tOpen + 2.0, 300, 330], [tOpen + 2.8, 320, 420], [tOpen + 3.6, 280, 480], [tNothing, 360, 200], [tNothing + 1, 470, 300]], t);
    cur.at(cx, cy);
    hB.set(k(t, tNothing, 1.0));
    b.c.style.transform = `scale(${lerp(1, 0.97, k(t, tOld, 2))})`;
  };
});

// 2 · title
scene("title", (L, s) => {
  const box = el("div", "center");
  const lg = el("div", "logo", `${logoSvg(84)}<span>Errata</span>`);
  const tag = el("div", "h1", `Every doc has errata. <span style="color:#ff4d6d">Find yours.</span>`, { marginTop: "34px", fontSize: "58px" });
  box.append(lg, tag); L.appendChild(box);
  const tFind = W("title", "Find");
  return (t) => { rise(lg, k(t, s.start + 0.2, 1.0)); lg.style.transform += ` scale(${lerp(0.94, 1, k(t, s.start, 2))})`; rise(tag, k(t, s.voice + 0.9, 1.0)); tag.lastElementChild && (tag.querySelector("span").style.opacity = k(t, tFind - 0.1, 0.6)); };
});

// 3 · why it matters
scene("why", (L, s) => {
  const n = el("div", "big", "0%", { position: "absolute", left: "260px", top: "250px", fontSize: "220px", color: "#fff" });
  const lab = el("div", "lead", "of developers start a new tool with a <b style='color:#fff'>quickstart or tutorial</b>", { position: "absolute", left: "270px", top: "500px", width: "760px", fontSize: "34px" });
  const src = el("div", null, "Survey of 202 developers, All Things Open 2025 (Catchy). Informal booth survey.", { position: "absolute", left: "270px", top: "640px", font: "500 18px Inter", color: "#6f7880" });
  const rows = el("div", null, null, { position: "absolute", left: "1080px", top: "300px", display: "flex", flexDirection: "column", gap: "26px" });
  const r1 = el("div", "panel", `<div style="padding:28px 32px;display:flex;align-items:center;gap:20px"><span class="pill ok">✓ checked</span><span style="font:700 34px Inter">Tests check <span style="color:#8b939c">the product</span></span></div>`, { position: "relative", width: "640px" });
  const r2 = el("div", "panel", `<div style="padding:28px 32px;display:flex;align-items:center;gap:20px"><span class="pill no">✗ nobody</span><span style="font:700 34px Inter">checks <span style="color:#ff4d6d">the words</span></span></div>`, { position: "relative", width: "640px" });
  rows.append(r1, r2); L.append(n, lab, src, rows);
  const t73 = W("why", "seventythree") , tTests = W("why", "tests"), tWords = W("why", "words");
  return (t) => {
    const c = k(t, t73 - 0.4, 1.8, eio); n.textContent = Math.round(73 * c) + "%"; rise(n, k(t, t73 - 0.5, 0.8)); rise(lab, k(t, t73 + 0.6, 0.9)); rise(src, k(t, t73 + 1.4, 0.9));
    rise(r1, k(t, W("why", "nobody") - 0.2, 0.9)); rise(r2, k(t, tTests + 0.6, 0.9));
  };
});

// 4 · how it works
scene("how", (L, s) => {
  const xs = [140, 560, 980, 1400], y = 330;
  const defs = [["Literal", "--mode action", "click exactly the words"], ["Goal", "--mode testing", "any route to the result"], ["Rewrite", "agent + guard", "only labels Kane clicked"], ["Prove", "--mode action", "run the new words"]];
  const nodes = defs.map(([b, m, d], i) => { const n = el("div", "node", `<b>${b}</b><span>${m}</span><div style="font:500 18px Inter;color:#c7cdd3">${d}</div>`, { left: xs[i] + "px", top: y + "px" }); L.appendChild(n); return n; });
  const svg = el("div", null, `<svg width="1920" height="1080" style="position:absolute;inset:0"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b939c"/></marker></defs>
    <path id="a1" d="M440 405 L556 405" stroke="#8b939c" stroke-width="3" fill="none" marker-end="url(#ah)"/>
    <path id="a2" d="M860 405 L976 405" stroke="#8b939c" stroke-width="3" fill="none" marker-end="url(#ah)"/>
    <path id="a3" d="M1280 405 L1396 405" stroke="#8b939c" stroke-width="3" fill="none" marker-end="url(#ah)"/>
    <path id="lp" d="M1560 326 C1560 230, 1140 230, 1140 322" stroke="#ffb340" stroke-width="3" fill="none" stroke-dasharray="10 10" marker-end="url(#ah)"/></svg>`, { position: "absolute", inset: 0 });
  L.appendChild(svg);
  const lab1 = el("div", null, "fails", { position: "absolute", left: "470px", top: "360px", font: "600 18px Inter", color: "#8b939c" });
  const lab2 = el("div", null, "actual path", { position: "absolute", left: "868px", top: "360px", font: "600 18px Inter", color: "#8b939c" });
  const loopLab = el("div", null, "fails → Kane's reason goes back · up to 3 loops", { position: "absolute", left: "1110px", top: "210px", font: "600 20px Inter", color: "#ffb340" });
  const gap = el("div", "h2", `the gap between them <span style="color:#ff4d6d">is the bug</span>`, { position: "absolute", left: "0", right: "0", top: "590px", textAlign: "center" });
  const outs = el("div", null, `<span class="pill ok">✓ words work · accurate</span><span class="pill warn">● words fail, goal works · drifted</span><span class="pill no">✗ nothing works · broken</span>`, { position: "absolute", left: "0", right: "0", top: "700px", display: "flex", justifyContent: "center", gap: "20px" });
  L.append(lab1, lab2, loopLab, gap, outs);
  const arrows = ["a1", "a2", "a3"].map((i) => svg.querySelector("#" + i)), lp = svg.querySelector("#lp");
  const tLit = W("how", "literal"), tGoal = W("how", "goal"), tGap = W("how", "gap"), tFix = W("how", "fix"), tRew = W("how", "rewrites"), tProve = W("how", "prove"), tAgain = W("how", "again");
  return (t) => {
    rise(nodes[0], k(t, tLit - 0.4, 0.8)); rise(nodes[1], k(t, tGoal - 0.4, 0.8)); rise(nodes[2], k(t, tRew - 0.4, 0.8)); rise(nodes[3], k(t, tProve - 0.4, 0.8));
    arrows[0].style.opacity = lab1.style.opacity = k(t, tGoal - 0.6, 0.6); arrows[1].style.opacity = lab2.style.opacity = k(t, tRew - 0.6, 0.6); arrows[2].style.opacity = k(t, tProve - 0.6, 0.6);
    lp.style.opacity = loopLab.style.opacity = k(t, tAgain - 0.4, 0.8);
    rise(gap, k(t, tGap - 0.3, 0.9) * (1 - k(t, tRew - 0.6, 0.6))); rise(outs, k(t, tFix, 0.9) * (1 - k(t, tRew - 0.6, 0.6)));
    nodes[0].style.borderColor = t > tGap - 0.3 && t < tRew - 0.5 ? "#ff4d6d" : "#2a2f35"; nodes[1].style.borderColor = t > tGap - 0.3 && t < tRew - 0.5 ? "#21c08b" : "#2a2f35";
    nodes[3].style.borderColor = t > tProve + 0.6 ? "#21c08b" : "#2a2f35";
  };
});

// 5 · why two passes: a smart agent hides drift
scene("hide", (L, s) => {
  const doc = el("div", "panel", `<div class="ph"><span>The doc says</span><span class="mono" style="color:#8b939c">quickstart.md · step 3</span></div><div style="padding:28px 30px;font:700 34px Inter">Click <span style="color:#fff">Settings → API Keys</span></div>`, { left: "180px", top: "250px", width: "700px" });
  const steps = ["Settings", "API Keys?", "Developers", "Tokens", "New token"];
  const trail = el("div", null, null, { position: "absolute", left: "1000px", top: "250px", display: "flex", flexDirection: "column", gap: "16px" });
  const items = steps.map((x, i) => { const c = el("div", "chip", (i === 1 ? "✗ " : "→ ") + x, i === 1 ? { color: "#ff4d6d", textDecoration: "line-through" } : null); trail.appendChild(c); return c; });
  const lab = el("div", null, "a smart agent finds another way", { position: "absolute", left: "1000px", top: "200px", font: "600 20px Inter", color: "#8b939c" });
  const pass = el("div", "pill ok", "✓ test passes", { position: "absolute", left: "1000px", top: "640px" });

// ───────────────────────────── captions (word-timed)
const cap = el("div", null, null); cap.id = "cap"; stage.appendChild(cap);
const DISPLAY = [[/\bN\s?-?\s?P\s?-?\s?X\b/gi, "npx"], [/errata C\s?-?\s?L\s?-?\s?I/gi, "errata-cli"], [/dash dash replay/gi, "--replay"], [/Print slash export/gi, "Print/export"], [/dot env/gi, ".env"], [/seventy-three percent/gi, "73%"], [/twenty nineteen/gi, "2019"]];
const phrases = [];
for (const s of TL.scenes) {
  let cur = [];
  s.words.forEach((w, i) => { const next = s.words[i + 1]; cur.push(w); const gap = next ? next.t - (w.t + w.d) : 9; if (cur.length >= 9 || gap > 0.32 || !next) { phrases.push({ start: cur[0].t, end: (next ? Math.min(next.t, w.t + w.d + 0.6) : w.t + w.d + 0.8), words: cur }); cur = []; } });
}
const fix = (s) => DISPLAY.reduce((a, [re, r]) => a.replace(re, r), s);
// stage 3d grain + vignette on top
stage.append(el("div", "vignette"), el("div", "grain"));

// ───────────────────────────── render(t)
window.render = (t) => {
  for (const { s, layer, upd } of scenes) {
    const fadeIn = s.start === 0 ? 1 : clamp((t - s.start + 0.25) / 0.5), fadeOut = clamp((s.end + 0.25 - t) / 0.5);
    const on = t >= s.start - 0.25 && t <= s.end + 0.25;
    layer.style.display = on ? "block" : "none";
    if (on) { layer.style.opacity = Math.min(fadeIn, fadeOut); upd(t); }
  }
  const p = phrases.find((p) => t >= p.start - 0.05 && t <= p.end);
  if (p) {
    // Clean the whole phrase first (so "N P X" becomes "npx"), then light words up in step with the voice.
    const shown = fix(p.words.map((w) => w.w).join(" ")).split(" ");
    const spoken = p.words.filter((w) => t >= w.t).length;
    const lit = Math.round((spoken / p.words.length) * shown.length);
    cap.innerHTML = `<span class="box">${shown.map((w, i) => `<span class="w${i < lit ? " on" : ""}">${w.replace(/</g, "&lt;")}</span>`).join(" ")}</span>`;
    cap.style.opacity = 1;
  } else cap.style.opacity = 0;
  stage.querySelector(".grain").style.transform = `translate(${(t * 37) % 40 - 20}px,${(t * 53) % 40 - 20}px)`;
};
window.ready = true;
</script>
